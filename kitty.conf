# Font
font_family JetBrainsMono Nerd Font
font_size 12.0
font_features JetBrainsMonoNF-Regular +liga +calt

# Cursor
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
cursor #c2fe0c

# Window
background_opacity 0.45
background_blur 0
window_padding_width 20
placement_strategy center

# Tab bar
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_background none
active_tab_foreground #c2fe0c
active_tab_background #0f0a14
inactive_tab_foreground #9e8e9e
inactive_tab_background #0a0810

# Colors — Marathon/Mr.Robot fusion
background #000000
foreground #ffffff
cursor #c2fe0c

# Black
color0 #0f0a14
color8 #1a1520

# Red
color1 #ff0d1a
color9 #ff4444

# Green (Marathon lime)
color2 #c2fe0c
color10 #d4ff3a

# Yellow
color3 #ffaa00
color11 #ffcc00

# Blue
color4 #5200ff
color12 #7722ff

# Pink (Lunar)
color5 #e8a0bf
color13 #f0b8d0

# Cyan
color6 #01ffff
color14 #44ffff

# White
color7 #cccccc
color15 #ffffff

# URLs
url_color #c2fe0c
url_style curly

# Performance
sync_to_monitor yes
shell tmux new-session -A -s main
