conky.config = {
    -- Position
    alignment = 'top_right',
    gap_x = 20,
    gap_y = 50,
    
    -- Window
    background = true,
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 180,	
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '0f0a14',

    -- Size
    minimum_width = 300,
    maximum_width = 300,
    
    -- Font
    font = 'JetBrainsMono Nerd Font:size=10',
    
    -- Colors
    default_color = 'ffffff',
	color1 = 'ffffff',
	color2 = 'ff00aa',
	color3 = 'ffffff',
	color4 = 'ff00aa',

    -- Behavior
    update_interval = 1,
    double_buffer = true,
    no_buffers = true,
    draw_shades = false,
    draw_outline = false,
    use_xft = true,
    override_utf8_locale = true,
}

conky.text = [[
${color1}[SYSTEM_HUD v1.0]${color}
${color3}─────────────────────────────${color}
${color2}TIME   ${color}${color1}${time %H:%M:%S}${color}
${color2}DATE   ${color}${color3}${time %d.%m.%Y}${color}
${color3}─────────────────────────────${color}
${color2}HOST   ${color}${color1}toaster${color}
${color2}OS     ${color}${color3}Kali Linux${color}
${color2}KERN   ${color}${color3}${kernel}${color}
${color3}─────────────────────────────${color}
${color2}CPU    ${color}${color1}${cpu}%${color} ${color4}${cpubar 6,150}
${color2}RAM    ${color}${color1}${memperc}%${color} ${color4}${membar 6,150}
${color2}DISK   ${color}${color1}${fs_used_perc /}%${color} ${color4}${fs_bar 6,150 /}
${color3}─────────────────────────────${color}
${color2}NET    ${color}${color1}${if_existing /proc/net/route wlan0}Connected${else}Offline${endif}${color}
${color2}TEMP   ${color}${color1}${hwmon 0 temp 1}°C${color}
${color2}UPTIME ${color}${color3}${uptime}${color}
${color2}BAT    ${color}${color1}${battery_percent BAT0}%${color} ${color4}${battery_bar 6,150 BAT0}
${color3}─────────────────────────────${color}
${color1}STATUS: ARMED${color}
${color2}TARGET: ACQUIRED${color}
${color1}SYSTEM: READY${color}
${color3}─────────────────────────────${color}
${color2}> ${color}${color1}Satellite Data Acquired${color}
${color2}> ${color}${color3}encrypting...${color}
${color3}─────────────────────────────${color}
${color1}[ STAY VIGILANT ]${color}
]]
