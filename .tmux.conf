# General
set -g default-terminal "screen-256color"
set -g history-limit 10000
set -g base-index 1
set -g pane-base-index 1
set -g mouse on

# Status bar
set -g status on
set -g status-position bottom
set -g status-interval 2

# Status bar colors
set -g status-style "bg=#0f0a14 fg=#ffffff"

# Left side
set -g status-left-length 40
set -g status-left "#[bg=#ff00aa,fg=#000000,bold] ⬡ SAINT14 #[bg=#0f0a14,fg=#ff00aa]▓▒░ "

# Right side
set -g status-right-length 60
set -g status-right " ░▒▓#[bg=#c2fe0c,fg=#000000,bold] %H:%M #[bg=#0f0a14,fg=#c2fe0c]▓▒░#[bg=#ff00aa,fg=#000000,bold] %d.%m.%Y "

# Window tabs
set -g window-status-format "#[fg=#9e8e9e] #I:#W "
set -g window-status-current-format "#[bg=#ff00aa,fg=#000000,bold] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#ff00aa"

# Message style
set -g message-style "bg=#ff00aa fg=#000000 bold"

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

# Quick reload
bind r source-file ~/.tmux.conf \; display "Config reloaded! ✅"

# Switch panes with Alt+arrow
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
